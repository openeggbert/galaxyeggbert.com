<!doctype html>
<!-- Source of assets/img/og-image.jpg (1200x630). Render: tools/og/render.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Fredoka"; src: url("../../assets/fonts/fredoka-latin.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Nunito"; src: url("../../assets/fonts/nunito-latin.woff2") format("woff2"); font-weight: 200 1000; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070a1f; }
  .og { position: relative; width: 1200px; height: 630px; font-family: "Nunito", sans-serif; color: #eef0ff; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,10,31,.95) 0%, rgba(7,10,31,.82) 42%, rgba(7,10,31,.15) 75%, rgba(7,10,31,.05) 100%); }
  .content { position: absolute; left: 64px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-family: "Fredoka"; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #ffe680; font-size: 22px; margin-bottom: 18px; }
  .logo { width: 600px; filter: drop-shadow(0 10px 20px rgba(0,0,0,.6)); }
  .tag { font-family: "Fredoka"; font-weight: 600; font-size: 46px; line-height: 1.12; margin: 26px 0 16px; }
  .tag b { color: #ffd43b; }
  .sub { font-size: 25px; font-weight: 700; color: #b4bbe2; }
  .url { position: absolute; right: 36px; bottom: 28px; font-family: "Fredoka"; font-weight: 600; font-size: 24px; padding: 8px 20px; border-radius: 999px; background: rgba(7,10,31,.75); border: 2px solid rgba(255,212,59,.6); color: #ffd43b; }
</style>
</head>
<body>
  <div class="og">
    <img class="bg" src="../../assets/shots/feat-campaign.webp" alt="">
    <div class="shade"></div>
    <div class="content">
      <div class="eyebrow">Free · Open source · Fan-made</div>
      <img class="logo" src="../../assets/img/logo@2x.webp" alt="Galaxy Eggbert">
      <div class="tag">Speedy Blupi, <b>reborn in true&nbsp;3D</b></div>
      <div class="sub">78 worlds · every original gadget · 3D world editor</div>
    </div>
    <div class="url">galaxyeggbert.com</div>
  </div>
</body>
</html>
